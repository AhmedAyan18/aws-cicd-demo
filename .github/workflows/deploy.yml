name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # -------------------
  # 1. TEST
  # -------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running tests..."
          echo "Tests passed!"

  # -------------------
  # 2. BUILD
  # -------------------
  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "Building application..."
          echo "Build successful!"

  # -------------------
  # 3. DEPLOY
  # -------------------
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        run: |
          echo "Deploying application to EC2..."
          echo "Deployment successful!"
